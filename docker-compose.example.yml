# Stack de exemplo: app + PostgreSQL + Redis (Evolution API e WuzAPI opcionais).
#
#   cp .env.example .env            # depois preencha os segredos
#   docker compose -f docker-compose.example.yml up -d --build
#   docker compose -f docker-compose.example.yml --profile evolution up -d   # provedor opcional
#
# O serviço `migrate` aplica as migrations do banco uma vez; depois o app inicia.
# Os segredos vêm do .env (POSTGRES_PASSWORD, EVOLUTION_API_KEY, WUZAPI_ADMIN_TOKEN):
# o compose se recusa a subir o banco sem POSTGRES_PASSWORD.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apienvios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: apienvios
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apienvios']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://apienvios:${POSTGRES_PASSWORD}@postgres:5432/apienvios
      DIRECT_DATABASE_URL: postgresql://apienvios:${POSTGRES_PASSWORD}@postgres:5432/apienvios
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://apienvios:${POSTGRES_PASSWORD}@postgres:5432/apienvios
      DIRECT_DATABASE_URL: postgresql://apienvios:${POSTGRES_PASSWORD}@postgres:5432/apienvios
      REDIS_HOST: redis
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # --- Provedores de WhatsApp opcionais (ative com --profile evolution / wuzapi) ---
  evolution:
    profiles: ['evolution']
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
    ports:
      - '8080:8080'

  wuzapi:
    profiles: ['wuzapi']
    image: asternic/wuzapi:latest
    restart: unless-stopped
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?defina WUZAPI_ADMIN_TOKEN no .env}
    ports:
      - '8888:8080'

volumes:
  pgdata:
  redisdata:
